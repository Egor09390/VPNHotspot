name: Build One UI 8.5 APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build debug APKs
        run: ./gradlew :mobile:assembleDebug --no-daemon

      - name: Upload APKs to Actions
        uses: actions/upload-artifact@v7
        with:
          name: VPNHotspot-OneUI85-APKs
          path: mobile/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish downloadable APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
          GIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p release
          find mobile/build/outputs/apk -type f -name '*.apk' -exec cp -t release {} +
          test -n "$(find release -name '*.apk' -print -quit)"
          gh release create "oneui85-build-${BUILD_NUMBER}" release/*.apk \
            --target "${GIT_SHA}" \
            --title "VPN Hotspot One UI 8.5 build ${BUILD_NUMBER}" \
            --notes "Experimental Samsung One UI 8.5 Quick Settings tile-state fix. Debug-signed APK; test before relying on it." \
            --prerelease
